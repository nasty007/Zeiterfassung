<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#181e26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nähtec Zeiterfassung</title>

  <style>
    :root {
      --bg: #10141b;
      --header-bg: #181e26;
      --card-bg: #21262e;
      --card-border: #383f4c;
      --nahtec-rot: #d12630;
      --col-start: #22c55e;
      --col-pause: #f59e0b;
      --col-ende: #ef4444;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    /* HEADER */
    header {
      background: var(--header-bg);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--nahtec-rot);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--nahtec-rot);
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .clock-display {
      text-align: right;
    }
    .clock-time {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .clock-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .settings-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* CONTAINER */
    main {
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* MITARBEITER-BADGE */
    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-name {
      font-weight: 700;
      font-size: 0.98rem;
    }
    .user-role {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .status-badge {
      background: #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* EINSATZORT / NOTIZ FÜR TECHNIKER */
    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .note-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .note-input {
      width: 100%;
      background: #141820;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .note-input:focus {
      border-color: var(--nahtec-rot);
    }

    /* STEMPEL-BUTTONS */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stamp-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
    }
    .stamp-btn:active {
      transform: scale(0.96);
    }

    .stamp-btn svg {
      width: 32px;
      height: 32px;
    }
    .stamp-btn span {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .btn-kommen { border-color: rgba(34, 197, 94, 0.4); }
    .btn-kommen svg { fill: var(--col-start); }
    .btn-kommen:active { background: var(--col-start); }
    .btn-kommen:active svg { fill: #fff; }

    .btn-pause { border-color: rgba(245, 158, 11, 0.4); }
    .btn-pause svg { fill: var(--col-pause); }
    .btn-pause:active { background: var(--col-pause); }
    .btn-pause:active svg { fill: #fff; }

    .btn-gehen { border-color: rgba(239, 68, 68, 0.4); }
    .btn-gehen svg { fill: var(--col-ende); }
    .btn-gehen:active { background: var(--col-ende); }
    .btn-gehen:active svg { fill: #fff; }

    /* STATUS MELDUNG */
    .toast {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
    }
    .toast-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }

    /* HISTORIE */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .reload-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2b3340;
      font-size: 0.88rem;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .history-time {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .history-note {
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .badge-mini {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
    }

    /* SETTINGS MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }
    .modal.open {
      display: flex;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      background: #141820;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-save {
      flex: 1;
      background: var(--nahtec-rot);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">NÄHTEC</div>
      <div class="brand-sub">GmbH · Service Mobile</div>
    </div>
    <div class="header-right">
      <div class="clock-display">
        <div class="clock-time" id="uhrzeit">--:--:--</div>
        <div class="clock-date" id="datum">--.--.----</div>
      </div>
      <button class="settings-btn" id="openSettings" title="Einstellungen">⚙</button>
    </div>
  </header>

  <main>
    <!-- Benutzer & Live-Status -->
    <section class="user-card">
      <div>
        <div class="user-name" id="dispMitarbeiter">Josip Lazic (148)</div>
        <div class="user-role">Servicetechniker Außendienst</div>
      </div>
      <div class="status-badge" id="dispBadge">Abgemeldet</div>
    </section>

    <!-- Optionaler Kunden- / Einsatzort-Eintrag für Techniker -->
    <section class="note-card">
      <label class="note-label">Kunde / Einsatzort (Optional)</label>
      <input type="text" id="kundenNotiz" class="note-input" placeholder="z. B. Kunde Mustermann, Montage..." />
    </section>

    <!-- Stempel-Kacheln -->
    <section class="stamp-grid">
      <button class="stamp-btn btn-kommen" onclick="buche('KOMMEN')">
        <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <span>Kommen</span>
      </button>

      <button class="stamp-btn btn-pause" onclick="buche('PAUSE')">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="2"/><rect x="14" y="4" width="4" height="16" rx="2"/></svg>
        <span>Pause</span>
      </button>

      <button class="stamp-btn btn-gehen" onclick="buche('GEHEN')">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        <span>Gehen</span>
      </button>
    </section>

    <!-- Statusmeldung / Toast -->
    <div class="toast" id="toast">
      <div class="toast-dot" id="toastDot"></div>
      <div id="toastText">Bereit zum Stempeln</div>
    </div>

    <!-- Letzte Buchungen (Historie) -->
    <section class="history-card">
      <div class="history-header">
        <span class="history-title">Letzte Buchungen</span>
        <button class="reload-btn" onclick="ladeHistorie()" title="Neu laden">↻</button>
      </div>
      <ul class="history-list" id="historyList">
        <li style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 12px 0;">
          Lade Buchungen von GitHub...
        </li>
      </ul>
    </section>
  </main>

  <!-- EINSTELLUNGEN-MODAL -->
  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">GitHub Synchronisation</div>

      <div class="field">
        <label>Mitarbeiter Name & Nummer</label>
        <input type="text" id="cfgMitarbeiter" value="Josip Lazic (148)" />
      </div>

      <div class="field">
        <label>GitHub Benutzername (Owner)</label>
        <input type="text" id="cfgUser" placeholder="z. B. dein-username" />
      </div>

      <div class="field">
        <label>Repository Name</label>
        <input type="text" id="cfgRepo" placeholder="z. B. zeiterfassung" />
      </div>

      <div class="field">
        <label>Personal Access Token (PAT mit 'repo' Rechten)</label>
        <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="schliesseSettings()">Abbrechen</button>
        <button class="btn-save" onclick="speichereSettings()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    // --- UHRZEIT & DATUM ---
    function tick() {
      const now = new Date();
      document.getElementById('uhrzeit').textContent = now.toLocaleTimeString('de-DE');
      document.getElementById('datum').textContent = now.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    setInterval(tick, 1000);
    tick();

    // --- KONFIGURATION LOKAL SPEICHERN ---
    const DEFAULTS = {
      mitarbeiter: "Josip Lazic (148)",
      user: "",
      repo: "",
      token: ""
    };

    function getConfig() {
      return {
        mitarbeiter: localStorage.getItem('cfg_mitarbeiter') || DEFAULTS.mitarbeiter,
        user: localStorage.getItem('cfg_user') || DEFAULTS.user,
        repo: localStorage.getItem('cfg_repo') || DEFAULTS.repo,
        token: localStorage.getItem('cfg_token') || DEFAULTS.token
      };
    }

    const modal = document.getElementById('settingsModal');
    document.getElementById('openSettings').onclick = () => {
      const c = getConfig();
      document.getElementById('cfgMitarbeiter').value = c.mitarbeiter;
      document.getElementById('cfgUser').value = c.user;
      document.getElementById('cfgRepo').value = c.repo;
      document.getElementById('cfgToken').value = c.token;
      modal.classList.add('open');
    };

    function schliesseSettings() {
      modal.classList.remove('open');
    }

    function speichereSettings() {
      localStorage.setItem('cfg_mitarbeiter', document.getElementById('cfgMitarbeiter').value.trim());
      localStorage.setItem('cfg_user', document.getElementById('cfgUser').value.trim());
      localStorage.setItem('cfg_repo', document.getElementById('cfgRepo').value.trim());
      localStorage.setItem('cfg_token', document.getElementById('cfgToken').value.trim());
      modal.classList.remove('open');
      document.getElementById('dispMitarbeiter').textContent = getConfig().mitarbeiter;
      zeigeToast("Einstellungen gespeichert!", "#22c55e");
      ladeHistorie();
    }

    function zeigeToast(text, farbe = "#64748b") {
      document.getElementById('toastText').textContent = text;
      document.getElementById('toastDot').style.background = farbe;
    }

    // Dateiname formatieren: zeiterfassung_YYYY-MM.csv
    function getMonatsDateiname() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `zeiterfassung_${d.getFullYear()}-${m}.csv`;
    }

    // Zeitstempel: YYYY-MM-DD HH:MM:SS
    function getZeitstempel() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // UTF-8 sicheres Base64
    function utf8_to_b64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function b64_to_utf8(str) {
      return decodeURIComponent(escape(atob(str)));
    }

    // --- BUCHUNG SENDEN (GITHUB REST API) ---
    async function buche(status) {
      const c = getConfig();
      if (!c.user || !c.repo || !c.token) {
        zeigeToast("Bitte erst Einstellungen (⚙) ausfüllen!", "#ef4444");
        modal.classList.add('open');
        return;
      }

      const stamp = getZeitstempel();
      const notiz = document.getElementById('kundenNotiz').value.trim();
      let maText = c.mitarbeiter;
      if (notiz) {
        maText += ` [${notiz}]`;
      }

      const neueZeile = `${stamp};${maText};${status}\n`;
      const dateiName = getMonatsDateiname();
      const apiUrl = `https://api.github.com/repos/${c.user}/${c.repo}/contents/${dateiName}`;

      zeigeToast(`Buche ${status}...`, "#f59e0b");

      try {
        // 1. Aktuelle CSV & SHA abrufen
        let sha = "";
        let inhalt = "Zeitstempel;Mitarbeiter;Status\n";

        const getRes = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${c.token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (getRes.status === 200) {
          const data = await getRes.json();
          sha = data.sha;
          inhalt = b64_to_utf8(data.content.replace(/\n/g, ''));
        }

        // Neue Zeile anhängen
        inhalt += neueZeile;

        // 2. Zurück zu GitHub schreiben
        const putBody = {
          message: `Mobile Buchung: ${status} (${c.mitarbeiter})`,
          content: utf8_to_b64(inhalt)
        };
        if (sha) putBody.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${c.token}`,
            "Content-Type": "application/json",
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify(putBody)
        });

        if (putRes.ok) {
          const farbe = (status === 'KOMMEN') ? '#22c55e' : (status === 'PAUSE' ? '#f59e0b' : '#ef4444');
          zeigeToast(`Erfolgreich gebucht: ${status}`, farbe);
          document.getElementById('kundenNotiz').value = ""; // Notiz leeren
          aktualisiereBadge(status);
          ladeHistorie();
        } else {
          zeigeToast("Fehler beim Hochladen (Token prüfen)", "#ef4444");
        }
      } catch (err) {
        zeigeToast("Netzwerkfehler: " + err.message, "#ef4444");
      }
    }

    function aktualisiereBadge(status) {
      const b = document.getElementById('dispBadge');
      if (status === 'KOMMEN') {
        b.textContent = "Eingestempelt";
        b.style.background = "var(--col-start)";
        b.style.color = "#fff";
      } else if (status === 'PAUSE') {
        b.textContent = "In Pause";
        b.style.background = "var(--col-pause)";
        b.style.color = "#fff";
      } else {
        b.textContent = "Feierabend";
        b.style.background = "var(--col-ende)";
        b.style.color = "#fff";
      }
    }

    // --- HISTORIE LADEN ---
    async function ladeHistorie() {
      const c = getConfig();
      if (!c.user || !c.repo || !c.token) return;

      const dateiName = getMonatsDateiname();
      const apiUrl = `https://api.github.com/repos/${c.user}/${c.repo}/contents/${dateiName}`;
      const listEl = document.getElementById('historyList');

      try {
        const res = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${c.token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (!res.ok) {
          listEl.innerHTML = `<li style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:8px 0;">Noch keine Buchungen für diesen Monat.</li>`;
          return;
        }

        const data = await res.json();
        const csv = b64_to_utf8(data.content.replace(/\n/g, ''));
        const zeilen = csv.trim().split('\n').filter(z => z.length > 5 && !z.startsWith("Zeitstempel"));

        if (zeilen.length === 0) {
          listEl.innerHTML = `<li style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:8px 0;">Keine Einträge.</li>`;
          return;
        }

        const letzte10 = zeilen.slice(-7).reverse();
        listEl.innerHTML = "";

        // Status vom neuesten Eintrag für den oberen Badge übernehmen
        const latestParts = letzte10[0].split(';');
        if (latestParts.length >= 3) {
          aktualisiereBadge(latestParts[2].trim());
        }

        letzte10.forEach(zeile => {
          const parts = zeile.split(';');
          if (parts.length < 3) return;
          const stamp = parts[0];
          const name = parts[1];
          const stat = parts[2].trim();

          const dParts = stamp.split(' ');
          const datumKurz = dParts[0].substring(8, 10) + "." + dParts[0].substring(5, 7) + ".";
          const zeitKurz = dParts[1] ? dParts[1].substring(0, 5) : "";

          // Notiz extrahieren falls vorhanden
          let notizText = "";
          const noteMatch = name.match(/\[(.*?)\]/);
          if (noteMatch) notizText = noteMatch[1];

          let bFarbe = "var(--col-start)";
          if (stat === "PAUSE") bFarbe = "var(--col-pause)";
          if (stat === "GEHEN" || stat === "ENDE") bFarbe = "var(--col-ende)";

          const li = document.createElement('li');
          li.className = 'history-item';
          li.innerHTML = `
            <div class="history-meta">
              <span class="history-time">${datumKurz} um ${zeitKurz} Uhr</span>
              ${notizText ? `<span class="history-note">📍 ${notizText}</span>` : ''}
            </div>
            <span class="badge-mini" style="background:${bFarbe}">${stat}</span>
          `;
          listEl.appendChild(li);
        });

      } catch (e) {
        listEl.innerHTML = `<li style="color:#ef4444; font-size:0.85rem; text-align:center;">Offline oder Ladefehler</li>`;
      }
    }

    // Beim Laden Mitarbeitername setzen & Historie anfordern
    document.getElementById('dispMitarbeiter').textContent = getConfig().mitarbeiter;
    ladeHistorie();
  </script>
</body>
</html>
