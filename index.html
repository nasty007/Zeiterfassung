<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nähtec Service Mobile</title>
  <style>
    :root {
      --bg: #10141a;
      --card: #21262e;
      --border: #383f4c;
      --text: #f0f6fc;
      --muted: #8b949e;
      --red: #d14444;
      --green: #22c55e;
      --yellow: #f59e0b;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--red); margin-bottom: 14px; }
    .brand { font-size: 19px; font-weight: bold; color: var(--red); letter-spacing: 1px; }
    .brand span { font-size: 13px; color: var(--muted); font-weight: normal; margin-left: 4px; }
    .clock { font-size: 16px; font-weight: 600; text-align: right; }
    .date { font-size: 12px; color: var(--muted); text-align: right; }

    .status-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 14px; }
    .user-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .user-role { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .badge-out   { background: #333; color: var(--muted); }
    .badge-in    { background: rgba(34,197,94,0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-fahrt { background: rgba(56,189,248,0.2); color: var(--blue); border: 1px solid var(--blue); }
    .badge-pause { background: rgba(245,158,11,0.2); color: var(--yellow); border: 1px solid var(--yellow); }

    /* Kunden-Feld */
    .input-group { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .input-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .input-field { width: 100%; background: #141820; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
    .input-field:focus { border-color: var(--blue); }

    /* Tasten-Sektionen */
    .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    
    .btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 6px; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .btn:active { transform: scale(0.96); }
    .btn-icon { font-size: 18px; }

    .btn-blue:hover,  .btn-blue:active  { border-color: var(--blue); background: rgba(56,189,248,0.15); }
    .btn-green:hover, .btn-green:active { border-color: var(--green); background: rgba(34,197,94,0.15); }
    .btn-yellow:hover,.btn-yellow:active{ border-color: var(--yellow); background: rgba(245,158,11,0.15); }
    .btn-red:hover,   .btn-red:active   { border-color: var(--red); background: rgba(209,68,68,0.15); }

    .toast { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }

    /* Historie */
    .history-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .history-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .history-row:last-child { border-bottom: none; }
    .h-info { display: flex; flex-direction: column; gap: 2px; }
    .h-kunde { font-size: 11px; color: var(--muted); }
    .h-status { font-weight: 600; padding: 3px 8px; border-radius: 6px; font-size: 11px; }

    .st-KOMMEN      { background: var(--green); color: #fff; }
    .st-GEHEN       { background: var(--red); color: #fff; }
    .st-PAUSE       { background: var(--yellow); color: #000; }
    .st-FAHRT_START { background: var(--blue); color: #000; }
    .st-FAHRT_ENDE  { background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    .st-ARBEIT_START{ background: var(--green); color: #fff; }
    .st-ARBEIT_ENDE { background: #1f4a2c; color: var(--green); border: 1px solid var(--green); }

    .settings-btn { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">NÄHTEC <span>Service Mobile</span></div>
      <div>
        <div class="clock" id="liveClock">--:--:--</div>
        <div class="date" id="liveDate">--.--.----</div>
      </div>
    </div>

    <div class="status-card">
      <div class="user-name" id="userNameLabel">Josip Lazic (148)</div>
      <div class="user-role">Servicetechniker Außendienst</div>
      <div class="badge badge-out" id="currentStatusBadge">Wird geladen...</div>
    </div>

    <!-- Kunde / Einsatzort -->
    <div class="input-group">
      <div class="input-label">Kunde / Einsatzort</div>
      <input type="text" id="kundeInput" class="input-field" placeholder="z. B. Textil Meyer, Stuttgart" />
    </div>

    <!-- 1. WEGZEIT -->
    <div class="section-title">Wegzeit (Fahrt zum / vom Kunden)</div>
    <div class="btn-grid">
      <button class="btn btn-blue" onclick="bucheEintrag('FAHRT_START', 'Fahrt Start')">
        <span class="btn-icon">🚗</span>
        <span>Fahrt Start</span>
      </button>
      <button class="btn btn-blue" onclick="bucheEintrag('FAHRT_ENDE', 'Fahrt Ende')">
        <span class="btn-icon">🏁</span>
        <span>Fahrt Ende</span>
      </button>
    </div>

    <!-- 2. ARBEITSZEIT BEI KUNDE -->
    <div class="section-title">Arbeitszeit vor Ort (beim Kunden)</div>
    <div class="btn-grid">
      <button class="btn btn-green" onclick="bucheEintrag('ARBEIT_START', 'Arbeit Start')">
        <span class="btn-icon">🔧</span>
        <span>Arbeit Start</span>
      </button>
      <button class="btn btn-green" onclick="bucheEintrag('ARBEIT_ENDE', 'Arbeit Ende')">
        <span class="btn-icon">✔</span>
        <span>Arbeit Ende</span>
      </button>
    </div>

    <!-- 3. ALLGEMEIN -->
    <div class="section-title">Allgemein</div>
    <div class="btn-grid-3">
      <button class="btn btn-green" onclick="bucheEintrag('KOMMEN', 'Kommen')">
        <span class="btn-icon">▶</span>
        <span>Kommen</span>
      </button>
      <button class="btn btn-yellow" onclick="bucheEintrag('PAUSE', 'Pause')">
        <span class="btn-icon">☕</span>
        <span>Pause</span>
      </button>
      <button class="btn btn-red" onclick="bucheEintrag('GEHEN', 'Gehen')">
        <span class="btn-icon">🏠</span>
        <span>Gehen</span>
      </button>
    </div>

    <div class="toast" id="toastMsg">Bereit</div>

    <div class="section-title">Letzte Buchungen</div>
    <div class="history-card" id="historyList">
      <div class="history-row" style="color: var(--muted);">Lade Buchungen...</div>
    </div>

    <button class="settings-btn" onclick="konfiguriereZugang()">⚙ Zugangsdaten einrichten</button>
  </div>

  <script>
    let GH_USER = localStorage.getItem("gh_user") || "nasty007";
    let GH_REPO = localStorage.getItem("gh_repo") || "Zeiterfassung";
    let GH_TOKEN = localStorage.getItem("gh_token") || "";
    let MITARBEITER = localStorage.getItem("gh_name") || "Josip Lazic (148)";

    function aktualisiereUhrzeit() {
      const now = new Date();
      document.getElementById("liveClock").innerText = now.toTimeString().split(" ")[0];
      const d = String(now.getDate()).padStart(2, "0");
      const m = String(now.getMonth() + 1).padStart(2, "0");
      document.getElementById("liveDate").innerText = `${d}.${m}.${now.getFullYear()}`;
    }
    setInterval(aktualisiereUhrzeit, 1000);
    aktualisiereUhrzeit();

    function getMonatsDateiname() {
      const now = new Date();
      return `zeiterfassung_${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}.csv`;
    }

    function setToast(msg, isError = false) {
      const el = document.getElementById("toastMsg");
      el.innerText = msg;
      el.style.color = isError ? "var(--red)" : "var(--muted)";
    }

    function konfiguriereZugang() {
      const t = prompt("GitHub Personal Access Token (PAT):", GH_TOKEN);
      if (t !== null) { GH_TOKEN = t.trim(); localStorage.setItem("gh_token", GH_TOKEN); }
      const u = prompt("GitHub Benutzername:", GH_USER);
      if (u !== null) { GH_USER = u.trim(); localStorage.setItem("gh_user", GH_USER); }
      const r = prompt("Repository Name:", GH_REPO);
      if (r !== null) { GH_REPO = r.trim(); localStorage.setItem("gh_repo", GH_REPO); }
      ladeBuchungen();
    }

    async function ladeBuchungen() {
      if (!GH_TOKEN) {
        setToast("Bitte Zugangsdaten einrichten!", true);
        return;
      }
      const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${getMonatsDateiname()}`;
      try {
        const res = await fetch(url, {
          headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
        });
        if (!res.ok) {
          setToast("Monatsdatei noch nicht vorhanden oder Token prüfen", true);
          return;
        }
        const data = await res.json();
        const csv = decodeURIComponent(escape(atob(data.content)));
        verarbeiteCsv(csv);
      } catch (err) {
        setToast("Fehler beim Laden von GitHub", true);
      }
    }

    function verarbeiteCsv(csv) {
      const zeilen = csv.split("\n").filter(z => z.trim().length > 0);
      const today = new Date().toISOString().slice(0, 10);
      const listEl = document.getElementById("historyList");
      listEl.innerHTML = "";

      let heutige = [];
      let letzterStatus = "Abgemeldet";

      for (let i = 1; i < zeilen.length; i++) {
        const c = zeilen[i].split(";");
        if (c.length >= 3) {
          const stamp = c[0].trim();
          const stat  = c[2].trim();
          const kunde = c.length > 3 ? c[3].trim() : "";

          if (stamp.startsWith(today)) {
            heutige.push({ stamp, stat, kunde });
            letzterStatus = stat;
          }
        }
      }

      // Status-Badge aktualisieren
      const badge = document.getElementById("currentStatusBadge");
      if (letzterStatus === "FAHRT_START") {
        badge.className = "badge badge-fahrt";
        badge.innerText = "Auf der Fahrt 🚗";
      } else if (letzterStatus === "ARBEIT_START" || letzterStatus === "KOMMEN") {
        badge.className = "badge badge-in";
        badge.innerText = "Eingestempelt 🔧";
      } else if (letzterStatus === "PAUSE") {
        badge.className = "badge badge-pause";
        badge.innerText = "In Pause ☕";
      } else {
        badge.className = "badge badge-out";
        badge.innerText = "Abgemeldet / Frei";
      }

      if (heutige.length === 0) {
        listEl.innerHTML = `<div class="history-row" style="color: var(--muted);">Heute noch keine Buchungen</div>`;
        return;
      }

      heutige.reverse().slice(0, 8).forEach(e => {
        const uhr = e.stamp.substring(11, 16);
        const row = document.createElement("div");
        row.className = "history-row";
        row.innerHTML = `
          <div class="h-info">
            <span>${uhr} Uhr</span>
            ${e.kunde ? `<span class="h-kunde">${e.kunde}</span>` : ""}
          </div>
          <span class="h-status st-${e.stat}">${e.stat.replace('_', ' ')}</span>
        `;
        listEl.appendChild(row);
      });
    }

    async function bucheEintrag(status, label) {
      if (!GH_TOKEN) { konfiguriereZugang(); return; }
      
      const kunde = document.getElementById("kundeInput").value.trim();
      let wegzeitInfo = "-";
      let arbeitInfo = "-";

      if (status === "FAHRT_START") wegzeitInfo = "Beginn Fahrt";
      else if (status === "FAHRT_ENDE") wegzeitInfo = "Ankunft";
      else if (status === "ARBEIT_START") arbeitInfo = "Beginn vor Ort";
      else if (status === "ARBEIT_ENDE") arbeitInfo = "Ende vor Ort";

      setToast(`Buche ${label}...`);
      const datei = getMonatsDateiname();
      const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${datei}`;

      try {
        let sha = "";
        let inhalt = "Zeitstempel;Mitarbeiter;Status;Kunde;Wegzeit;Arbeitszeit_Kunde\n";

        const resGet = await fetch(url, {
          headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
        });
        if (resGet.ok) {
          const d = await resGet.json();
          sha = d.sha;
          inhalt = decodeURIComponent(escape(atob(d.content)));
          if (!inhalt.endsWith("\n")) inhalt += "\n";
        }

        const now = new Date();
        const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        // 6 Spalten einfügen
        const neueZeile = `${stamp};${MITARBEITER};${status};${kunde || '-'};${wegzeitInfo};${arbeitInfo}\n`;
        const neuerInhalt = inhalt + neueZeile;
        const b64 = btoa(unescape(encodeURIComponent(neuerInhalt)));

        const resPut = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${GH_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify({ message: `Service: ${label} (${stamp})`, content: b64, sha: sha || undefined })
        });

        if (resPut.ok) {
          setToast(`Erfolgreich gebucht: ${label}`);
          verarbeiteCsv(neuerInhalt);
        } else {
          setToast("Fehler beim Buchen auf GitHub", true);
        }
      } catch (err) {
        setToast("Netzwerkfehler", true);
      }
    }

    if (GH_TOKEN) ladeBuchungen();
  </script>
</body>
</html>
