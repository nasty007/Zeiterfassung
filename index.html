<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NÄHTEC Service Mobile</title>
    <meta name="theme-color" content="#12141C">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12141C;
            --header: #181E24;
            --nahtec-rot: #D14444;
            --card-bg: #1E232B;
            --card-border: #323A46;
            --btn-bg: #272D38;
            --text-light: #FFFFFF;
            --text-muted: #8E9BAE;
            
            --col-kommen: #10B981;
            --col-pause:  #F59E0B;
            --col-gehen:  #EF4444;
            --col-fahrt:  #3B82F6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- Header --- */
        .header {
            background: var(--header);
            border-bottom: 2px solid var(--nahtec-rot);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area { display: flex; align-items: baseline; gap: 8px; }
        .logo-nahtec { color: var(--nahtec-rot); font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        .logo-subtitle { color: var(--text-muted); font-size: 14px; font-weight: 600; }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .sync-btn {
            background: transparent; border: none; color: var(--text-light);
            font-size: 20px; cursor: pointer; transition: transform 0.3s;
        }
        .sync-btn:active { transform: rotate(180deg); }
        .settings-btn { font-size: 20px; cursor: pointer; color: var(--text-muted); }

        /* --- Tabs Navigation --- */
        .tabs {
            display: flex;
            margin: 20px 20px 10px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }
        .tab-btn {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px;
            font-weight: 600; font-size: 14px; color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .tab-btn.active { background: var(--card-border); color: var(--text-light); }

        /* --- Swiper Container --- */
        .swiper-container {
            display: flex; width: 200vw;
            transition: transform 0.3s ease-out; will-change: transform;
            align-items: flex-start;
        }
        .swiper-slide { width: 100vw; padding: 0 20px 80px 20px; flex-shrink: 0; }

        /* --- User Card (Cockpit) --- */
        .user-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
            text-align: center;
        }
        .user-name { font-size: 18px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; }
        .user-title { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
        .status-badge {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-weight: 600; font-size: 14px; color: #fff; background: var(--card-border);
        }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: var(--col-kommen); border: 1px solid var(--col-kommen); }
        .bg-orange { background: rgba(245, 158, 11, 0.2); color: var(--col-pause); border: 1px solid var(--col-pause); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: var(--col-gehen); border: 1px solid var(--col-gehen); }
        .bg-blue { background: rgba(59, 130, 246, 0.2); color: var(--col-fahrt); border: 1px solid var(--col-fahrt); }

        /* --- Eingabefeld --- */
        .input-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group:last-child { margin-bottom: 0; }
        
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--card-border);
            background: var(--bg); color: var(--text-light); font-size: 15px;
        }

        /* --- Buchungs-Sektionen --- */
        .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        
        .btn-action {
            background: var(--btn-bg); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 16px 10px;
            color: var(--text-light); font-weight: 600; font-size: 13px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-action:active { background: var(--card-border); }
        .btn-action span { font-size: 20px; }

        /* --- Seite 2: Dashboard & Historie --- */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .kachel {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 16px; text-align: center;
        }
        .kachel-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .kachel-value { font-size: 20px; font-weight: 700; }
        .kachel-full { grid-column: span 2; margin-bottom: 24px; }
        
        .val-kommen { color: var(--col-kommen); }
        .val-pause { color: var(--col-pause); }
        .val-ueber { color: var(--col-kommen); font-size: 24px; }
        .val-ueber.minus { color: var(--col-gehen); }

        .historie-liste { display: flex; flex-direction: column; gap: 10px; }
        .hist-item {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hist-info { display: flex; flex-direction: column; gap: 4px; }
        .hist-time { font-weight: 600; font-size: 15px; }
        .hist-meta { font-size: 12px; color: var(--text-muted); }
        
        .hist-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
            color: #fff; text-transform: uppercase;
        }
        .b-kom { background: var(--col-kommen); }
        .b-pau { background: var(--col-pause); color: #000; }
        .b-geh { background: var(--col-gehen); }
        .b-def { background: var(--card-border); color: var(--text-muted); }

        #syncInfo { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-nahtec">NÄHTEC</div>
            <div class="logo-subtitle">Service Mobile</div>
        </div>
        <div class="header-actions">
            <span class="settings-btn" onclick="konfiguriereZugang()">⚙️</span>
            <button class="sync-btn" onclick="ladeDatenVonGitHub()">🔄</button>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
        <div class="tab-btn active" id="tab0" onclick="wechsleSeite(0)">BUCHEN</div>
        <div class="tab-btn" id="tab1" onclick="wechsleSeite(1)">ÜBERSICHT</div>
    </div>

    <!-- Swiper Container -->
    <div class="swiper-container" id="swiper">
        
        <!-- ================= SEITE 1: BUCHEN ================= -->
        <div class="swiper-slide">
            
            <div class="user-card">
                <div class="user-name" id="ui-username">Lade...</div>
                <!-- Dynamisches Feld für die Funktion -->
                <div class="user-title" id="ui-usertitle">Lade...</div>
                <div class="status-badge" id="ui-status">Lädt...</div>
            </div>

            <!-- Eingabefelder -->
            <div class="input-card">
                <div class="input-group">
                    <label>KUNDE / EINSATZORT</label>
                    <input type="text" id="kundenEingabe" placeholder="z. B. Textil Meyer, Stuttgart">
                </div>
                <div class="input-group">
                    <label>AUFTRAGS-NR. / REPARATURSCHEIN (OPTIONAL)</label>
                    <input type="text" id="repNummer" placeholder="z. B. REP-4711">
                </div>
            </div>

            <div class="section-title">WEGZEIT (FAHRT ZUM / VOM KUNDEN)</div>
            <div class="btn-grid-2">
                <button class="btn-action" onclick="buche('FAHRT START')"><span>🚗</span> Fahrt Start</button>
                <button class="btn-action" onclick="buche('FAHRT ENDE')"><span>🏁</span> Fahrt Ende</button>
            </div>

            <div class="section-title">ARBEITSZEIT VOR ORT (BEIM KUNDEN)</div>
            <div class="btn-grid-2">
                <button class="btn-action" onclick="buche('ARBEIT START')"><span>🔧</span> Arbeit Start</button>
                <button class="btn-action" onclick="buche('ARBEIT ENDE')"><span>✔</span> Arbeit Ende</button>
            </div>

            <div class="section-title">ALLGEMEIN</div>
            <div class="btn-grid-3">
                <button class="btn-action" onclick="buche('KOMMEN')"><span>▶</span> Kommen</button>
                <button class="btn-action" onclick="buche('PAUSE')"><span>☕</span> Pause</button>
                <button class="btn-action" onclick="buche('GEHEN')"><span>🏠</span> Gehen</button>
            </div>

        </div>

        <!-- ================= SEITE 2: ÜBERSICHT & HISTORIE ================= -->
        <div class="swiper-slide">
            
            <div class="dash-grid">
                <div class="kachel">
                    <div class="kachel-title">Heute gearbeitet</div>
                    <div class="kachel-value val-kommen" id="ui-arbeitszeit">00:00 Std.</div>
                </div>
                <div class="kachel">
                    <div class="kachel-title">Pausenzeit</div>
                    <div class="kachel-value val-pause" id="ui-pausenzeit">00:00 Std.</div>
                </div>
            </div>

            <div class="kachel kachel-full">
                <div class="kachel-title">Überstunden-Konto</div>
                <div class="kachel-value val-ueber" id="ui-ueberstunden">0.00 Std.</div>
            </div>

            <div class="section-title">LETZTE BUCHUNGEN</div>
            <div class="historie-liste" id="historieContainer">
                <div class="hist-item"><div class="hist-time">Lade Daten...</div></div>
            </div>
            
            <div id="syncInfo">Letzter Sync: Nie</div>
        </div>

    </div>

    <script>
        // ==========================================
        // SWIPER LOGIK
        // ==========================================
        const swiper = document.getElementById('swiper');
        let aktuelleSeite = 0;
        let startX = 0;
        let isSwiping = false;

        function wechsleSeite(index) {
            aktuelleSeite = index;
            swiper.style.transform = `translateX(-${aktuelleSeite * 100}vw)`;
            document.getElementById('tab0').classList.toggle('active', aktuelleSeite === 0);
            document.getElementById('tab1').classList.toggle('active', aktuelleSeite === 1);
        }

        document.addEventListener('touchstart', e => {
            if (e.target.tagName === 'INPUT') return; 
            startX = e.touches[0].clientX;
            isSwiping = true;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            if (!isSwiping) return;
            isSwiping = false;
            const diff = startX - e.changedTouches[0].clientX;
            if (diff > 60 && aktuelleSeite === 0) wechsleSeite(1);
            else if (diff < -60 && aktuelleSeite === 1) wechsleSeite(0);
        });

        // ==========================================
        // KONFIGURATION
        // ==========================================
        let GH_USER = localStorage.getItem("gh_user") || "nasty007";
        let GH_REPO = localStorage.getItem("gh_repo") || "Zeiterfassung";
        let GH_TOKEN = localStorage.getItem("gh_token") || "";
        
        let GH_PNR      = localStorage.getItem("gh_pnr") || "148";
        let GH_NAME     = localStorage.getItem("gh_name") || "Josip Lazic";
        let GH_FUNKTION = localStorage.getItem("gh_funktion") || "Elektrotechniker";
        let UEBERSTUNDEN_START = parseFloat(localStorage.getItem("gh_ueberstunden_start") || "0.0");

        let lokalerInhalt = "";
        let letzterSha = "";

        function getMonatsDateiname() {
            const now = new Date();
            const j = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            return `zeiterfassung_${GH_PNR}_${j}-${m}.csv`;
        }

        function konfiguriereZugang() {
            const n = prompt("Dein Name:", GH_NAME);
            if (n !== null) { GH_NAME = n.trim(); localStorage.setItem("gh_name", GH_NAME); }

            const p = prompt("Deine Personalnummer (z.B. 148):", GH_PNR);
            if (p !== null) { GH_PNR = p.trim(); localStorage.setItem("gh_pnr", GH_PNR); }

            // NEU: Abfrage der Funktion/Position
            const f = prompt("Deine Funktion/Position (z.B. Elektrotechniker):", GH_FUNKTION);
            if (f !== null) { GH_FUNKTION = f.trim(); localStorage.setItem("gh_funktion", GH_FUNKTION); }

            const u = prompt("Überstunden Startguthaben (z.B. 14.5 oder -2.0):", UEBERSTUNDEN_START);
            if (u !== null) { 
                UEBERSTUNDEN_START = parseFloat(u.replace(',', '.')); 
                localStorage.setItem("gh_ueberstunden_start", UEBERSTUNDEN_START); 
            }

            const repo = prompt("Repository-Name:", GH_REPO);
            if (repo !== null) { GH_REPO = repo.trim(); localStorage.setItem("gh_repo", GH_REPO); }
            
            const t = prompt("Personal Access Token (ghp_...):", GH_TOKEN);
            if (t !== null) { GH_TOKEN = t.trim(); localStorage.setItem("gh_token", GH_TOKEN); }
            
            alert("Gespeichert! App wird neu geladen.");
            location.reload();
        }

        // ==========================================
        // HILFSFUNKTIONEN ZEIT
        // ==========================================
        function getSekunden(uhrzeit) {
            const p = uhrzeit.split(':');
            return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
        }
        function formatiereSekunden(sek) {
            const h = Math.floor(sek / 3600);
            const m = Math.floor((sek % 3600) / 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        // ==========================================
        // GITHUB API
        // ==========================================
        async function ladeDatenVonGitHub() {
            document.getElementById("ui-username").innerText = `${GH_NAME} (${GH_PNR})`;
            document.getElementById("ui-usertitle").innerText = GH_FUNKTION; // Hier wird die Funktion ins UI geschrieben
            
            if (!GH_TOKEN || GH_TOKEN.length < 10) {
                document.getElementById("ui-status").innerText = "Token fehlt!";
                return;
            }

            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${getMonatsDateiname()}`;
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
                });

                if (response.status === 404) {
                    lokalerInhalt = "Zeitstempel;Mitarbeiter;Status;RepNummer;KundeOrt\n";
                    letzterSha = "";
                    aktualisiereUI();
                    return;
                }
                if (!response.ok) throw new Error("Fehler beim Laden");

                const data = await response.json();
                letzterSha = data.sha;
                lokalerInhalt = decodeURIComponent(escape(atob(data.content)));
                
                const now = new Date();
                document.getElementById("syncInfo").innerText = `Letzter Sync: ${now.toLocaleTimeString()}`;
                aktualisiereUI();
            } catch (err) {
                console.error(err);
            }
        }

        async function sichereDatenAufGitHub(neuerInhalt, commitMessage) {
            document.getElementById("ui-status").innerText = "Speichert...";
            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${getMonatsDateiname()}`;
            const b64Content = btoa(unescape(encodeURIComponent(neuerInhalt)));
            const bodyData = { message: commitMessage, content: b64Content };
            if (letzterSha) bodyData.sha = letzterSha;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });
                if (!response.ok) throw new Error("Speichern fehlgeschlagen");
                
                document.getElementById("repNummer").value = "";
                document.getElementById("kundenEingabe").value = "";
                ladeDatenVonGitHub();
            } catch (err) {
                alert("Fehler beim Speichern!");
            }
        }

        function buche(status) {
            const rep = document.getElementById("repNummer").value.trim();
            const kunde = document.getElementById("kundenEingabe").value.trim();
            const now = new Date();
            const timestamp = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0') + " " + String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + ":" + String(now.getSeconds()).padStart(2, '0');

            const neueZeile = `${timestamp};${GH_NAME};${status};${rep};${kunde}\n`;
            if (lokalerInhalt === "") lokalerInhalt = "Zeitstempel;Mitarbeiter;Status;RepNummer;KundeOrt\n";
            sichereDatenAufGitHub(lokalerInhalt + neueZeile, `Web-Buchung: ${status}`);
        }

        // ==========================================
        // UI & DASHBOARD LOGIK
        // ==========================================
        function aktualisiereUI() {
            const zeilen = lokalerInhalt.split('\n').filter(z => z.length > 10 && !z.startsWith("Zeitstempel"));
            if (zeilen.length === 0) return;

            const now = new Date();
            const heuteTag = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');
            const wochentag = now.getDay(); 

            let arbeitSekundenHeute = 0;
            let pauseSekundenHeute = 0;
            let letzterStatusWechsel = 0;
            let letzterStatus = "";
            let ersterStartSek = -1;

            const htmlZeilen = [];

            for (let i = 0; i < zeilen.length; i++) {
                const parts = zeilen[i].split(';');
                if (parts.length < 3) continue;

                const stamp = parts[0];
                let statusRaw = parts[2].trim();
                let repNummer = (parts.length > 3) ? parts[3].trim() : "";
                let kunde = (parts.length > 4) ? parts[4].trim() : "";
                
                let isArbeit = (statusRaw === "KOMMEN" || statusRaw === "FAHRT START" || statusRaw === "ARBEIT START" || statusRaw === "FAHRT ENDE" || statusRaw === "ARBEIT ENDE" || statusRaw === "START");
                let isPause  = (statusRaw === "PAUSE");
                let isGehen  = (statusRaw === "GEHEN" || statusRaw === "ENDE" || statusRaw === "ARBEIT_ENDE");

                // Badge Logik für Historie
                let badgeClass = "b-def";
                if(statusRaw.includes("KOMMEN") || statusRaw.includes("START")) badgeClass = "b-kom";
                if(statusRaw.includes("PAUSE")) badgeClass = "b-pau";
                if(statusRaw.includes("GEHEN") || statusRaw.includes("ENDE")) badgeClass = "b-geh";

                if (zeilen.length - i <= 10) {
                    const uhrzeit = stamp.substring(11, 16) + " Uhr";
                    let metaHTML = `<span class="hist-meta">${stamp.substring(8, 10)}.${stamp.substring(5, 7)}.</span>`;
                    
                    if (repNummer) metaHTML += `<br><span class="hist-meta">📄 ${repNummer}</span>`;
                    if (kunde) metaHTML += `<br><span class="hist-meta">📍 ${kunde}</span>`;

                    htmlZeilen.unshift(`
                        <div class="hist-item">
                            <div class="hist-info"><span class="hist-time">${uhrzeit}</span>${metaHTML}</div>
                            <span class="hist-badge ${badgeClass}">${statusRaw}</span>
                        </div>
                    `);
                }

                if (stamp.startsWith(heuteTag)) {
                    const sec = getSekunden(stamp.substring(11, 19));
                    if (ersterStartSek < 0 && isArbeit) ersterStartSek = sec;

                    if (letzterStatus === "ARBEIT") arbeitSekundenHeute += (sec - letzterStatusWechsel);
                    else if (letzterStatus === "PAUSE") pauseSekundenHeute += (sec - letzterStatusWechsel);

                    letzterStatus = isArbeit ? "ARBEIT" : (isPause ? "PAUSE" : "GEHEN");
                    letzterStatusWechsel = sec;
                    
                    document.aktuellerStatusRaw = statusRaw;
                }
            }

            document.getElementById("historieContainer").innerHTML = htmlZeilen.join('');

            // Großes User Status-Badge aktualisieren
            const statusEl = document.getElementById("ui-status");
            const raw = document.aktuellerStatusRaw || "";
            
            if (letzterStatus === "ARBEIT") {
                if(raw === "FAHRT START") { statusEl.className = "status-badge bg-blue"; statusEl.innerText = "Unterwegs 🚗"; }
                else if(raw === "ARBEIT START") { statusEl.className = "status-badge bg-green"; statusEl.innerText = "Beim Kunden 🔧"; }
                else { statusEl.className = "status-badge bg-green"; statusEl.innerText = "Eingestempelt"; }
            } else if (letzterStatus === "PAUSE") {
                statusEl.className = "status-badge bg-orange"; statusEl.innerText = "In Pause ☕";
            } else if (letzterStatus === "GEHEN") {
                statusEl.className = "status-badge bg-red"; statusEl.innerText = "Feierabend 🏠";
            } else {
                statusEl.className = "status-badge"; statusEl.innerText = "Abgemeldet";
            }

            // Live-Zeiten dazurechnen
            const jetzSek = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            if (letzterStatus === "ARBEIT") arbeitSekundenHeute += (jetzSek - letzterStatusWechsel);
            else if (letzterStatus === "PAUSE") pauseSekundenHeute += (jetzSek - letzterStatusWechsel);

            document.getElementById("ui-arbeitszeit").innerText = formatiereSekunden(arbeitSekundenHeute) + " Std.";
            document.getElementById("ui-pausenzeit").innerText = formatiereSekunden(pauseSekundenHeute) + " Std.";

            // Überstunden berechnen
            let tagesSoll = 30600; 
            if (wochentag === 5) tagesSoll = 18000; 
            if (wochentag === 0 || wochentag === 6) tagesSoll = 0; 

            let heuteUeberSek = 0;
            if (arbeitSekundenHeute > tagesSoll) heuteUeberSek = arbeitSekundenHeute - tagesSoll;

            const aktuellesKonto = UEBERSTUNDEN_START + (heuteUeberSek / 3600.0);
            const uKachel = document.getElementById("ui-ueberstunden");
            
            uKachel.innerText = (aktuellesKonto > 0 ? "+" : "") + aktuellesKonto.toFixed(2) + " Std.";
            if (aktuellesKonto < 0) uKachel.classList.add("minus"); else uKachel.classList.remove("minus");
        }

        ladeDatenVonGitHub();
        setInterval(aktualisiereUI, 1000);
    </script>
</body>
