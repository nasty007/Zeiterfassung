<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NÄHTEC Zeiterfassung</title>
    <!-- Dark Theme Anpassung für mobile Browser -->
    <meta name="theme-color" content="#10121A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #10121A;
            --header: #181E24;
            --nahtec-rot: #D11414;
            --card-bg: #21262E;
            --card-border: #383F4C;
            --text-light: #FFFFFF;
            --text-muted: #9CBDD3;
            
            --col-kommen: #14C656;
            --col-pause:  #FA9600;
            --col-gehen:  #A73739; /* Neues gedämpftes Rot aus dem ESP32-Terminal */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        .header {
            background: var(--header);
            border-bottom: 2px solid var(--nahtec-rot);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area { display: flex; align-items: baseline; gap: 8px; }
        .logo-nahtec { color: var(--nahtec-rot); font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        .logo-gmbh { color: var(--text-muted); font-size: 14px; }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .sync-btn {
            background: transparent; border: none; color: var(--text-light);
            font-size: 22px; cursor: pointer; transition: transform 0.3s;
        }
        .sync-btn:active { transform: rotate(180deg); }
        .settings-btn { font-size: 20px; cursor: pointer; color: var(--text-muted); }

        /* --- Container --- */
        .container { padding: 20px; padding-bottom: 80px; }

        /* --- Status Badge --- */
        .status-badge-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .user-name { font-weight: 600; font-size: 16px; color: var(--text-muted); }
        .status-badge {
            background: var(--card-border); color: var(--text-light);
            padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 14px;
        }
        .status-kommen { background: var(--col-kommen); color: #fff; }
        .status-pause { background: var(--col-pause); color: #000; }
        .status-gehen { background: var(--col-gehen); color: #fff; }

        /* --- Eingabe-Formular für manuelle Web-Buchungen --- */
        .booking-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 20px; margin-bottom: 24px;
        }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--card-border); background: var(--bg);
            color: var(--text-light); font-size: 16px;
        }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .btn-action {
            padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 16px;
            color: #fff; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-action:active { opacity: 0.7; }
        .btn-kommen { background: var(--col-kommen); }
        .btn-pause { background: var(--col-pause); color: #000; }
        .btn-gehen { background: var(--col-gehen); grid-column: span 2; }

        /* --- Dashboard Kacheln --- */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .kachel {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 16px; text-align: center;
        }
        .kachel-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .kachel-value { font-size: 20px; font-weight: 700; }
        
        .val-kommen { color: var(--col-kommen); }
        .val-pause { color: var(--col-pause); }
        .val-gehen { color: var(--text-light); }
        .val-ueberstunden { color: var(--col-kommen); }
        .val-ueberstunden.minus { color: var(--col-pause); }

        .kachel-ueberstunden { grid-column: span 2; }

        /* --- Historie --- */
        .historie-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text-light); }
        .historie-liste { display: flex; flex-direction: column; gap: 10px; }
        .hist-item {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hist-info { display: flex; flex-direction: column; gap: 4px; }
        .hist-time { font-weight: 600; font-size: 15px; }
        .hist-meta { font-size: 12px; color: var(--text-muted); }
        .hist-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
            color: #fff; text-transform: uppercase;
        }
        .bg-kommen { background: var(--col-kommen); }
        .bg-pause { background: var(--col-pause); color: #000; }
        .bg-gehen { background: var(--col-gehen); }

        #syncInfo { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-nahtec">NÄHTEC</div>
            <div class="logo-gmbh">GmbH</div>
        </div>
        <div class="header-actions">
            <span class="settings-btn" onclick="konfiguriereZugang()">⚙️</span>
            <button class="sync-btn" onclick="ladeDatenVonGitHub()">🔄</button>
        </div>
    </div>

    <div class="container">
        
        <div class="status-badge-container">
            <div class="user-name" id="ui-username">Nutzer wird geladen...</div>
            <div class="status-badge" id="ui-status">Lädt...</div>
        </div>

        <div class="dashboard-grid">
            <div class="kachel">
                <div class="kachel-title">Heute gearbeitet</div>
                <div class="kachel-value val-kommen" id="ui-arbeitszeit">--:-- Std.</div>
            </div>
            <div class="kachel">
                <div class="kachel-title">Pausenzeit</div>
                <div class="kachel-value val-pause" id="ui-pausenzeit">--:-- Std.</div>
            </div>
            <div class="kachel kachel-ueberstunden">
                <div class="kachel-title">Überstunden-Konto</div>
                <div class="kachel-value val-ueberstunden" id="ui-ueberstunden">--.-- Std.</div>
            </div>
        </div>

        <div class="booking-card">
            <div class="input-group">
                <label>Auftrags-Nr. / Reparaturschein (Optional)</label>
                <input type="text" id="repNummer" placeholder="z.B. REP-4711">
            </div>
            <div class="input-group">
                <label>Fahrtziel (Nur bei Fahrzeit-Buchung)</label>
                <input type="text" id="fahrtZiel" placeholder="z.B. Bietigheim Krankenhaus">
            </div>

            <div class="btn-grid">
                <button class="btn-action btn-kommen" onclick="buche('KOMMEN')">KOMMEN</button>
                <button class="btn-action btn-pause" onclick="buche('PAUSE')">PAUSE</button>
                <button class="btn-action btn-gehen" onclick="buche('GEHEN')">FEIERABEND</button>
            </div>
        </div>

        <div class="historie-title">Letzte Buchungen</div>
        <div class="historie-liste" id="historieContainer">
            <div class="hist-item"><div class="hist-time">Daten werden geladen...</div></div>
        </div>

        <div id="syncInfo">Letzter Sync: Nie</div>
    </div>

    <script>
        // ==========================================
        // KONFIGURATION (MULTI-USER)
        // ==========================================
        let GH_USER = localStorage.getItem("gh_user") || "nasty007";
        let GH_REPO = localStorage.getItem("gh_repo") || "Zeiterfassung";
        let GH_TOKEN = localStorage.getItem("gh_token") || "";
        
        let GH_PNR   = localStorage.getItem("gh_pnr") || "148";
        let GH_NAME  = localStorage.getItem("gh_name") || "Josip Lazic";
        let UEBERSTUNDEN_START = parseFloat(localStorage.getItem("gh_ueberstunden_start") || "0.0");

        let lokalerInhalt = "";
        let letzterSha = "";

        // ==========================================
        // DATEINAME (Dynamisch nach Personalnummer)
        // ==========================================
        function getMonatsDateiname() {
            const now = new Date();
            const j = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            // Generiert z. B. zeiterfassung_148_2026-10.csv
            return `zeiterfassung_${GH_PNR}_${j}-${m}.csv`;
        }

        // ==========================================
        // EINSTELLUNGEN (ZAHNRAD)
        // ==========================================
        function konfiguriereZugang() {
            const n = prompt("Dein Name:", GH_NAME);
            if (n !== null) { GH_NAME = n.trim(); localStorage.setItem("gh_name", GH_NAME); }

            const p = prompt("Deine Personalnummer (z.B. 148):", GH_PNR);
            if (p !== null) { GH_PNR = p.trim(); localStorage.setItem("gh_pnr", GH_PNR); }

            const u = prompt("Überstunden Startguthaben (z.B. 14.5 oder -2.0):", UEBERSTUNDEN_START);
            if (u !== null) { 
                UEBERSTUNDEN_START = parseFloat(u.replace(',', '.')); 
                localStorage.setItem("gh_ueberstunden_start", UEBERSTUNDEN_START); 
            }

            const repo = prompt("Repository-Name:", GH_REPO);
            if (repo !== null) { GH_REPO = repo.trim(); localStorage.setItem("gh_repo", GH_REPO); }
            
            const t = prompt("Personal Access Token (ghp_...):", GH_TOKEN);
            if (t !== null) { GH_TOKEN = t.trim(); localStorage.setItem("gh_token", GH_TOKEN); }
            
            alert("Gespeichert! App wird neu geladen.");
            location.reload();
        }

        // ==========================================
        // HILFSFUNKTIONEN ZEITBERECHNUNG
        // ==========================================
        function getSekunden(uhrzeit) {
            const p = uhrzeit.split(':');
            return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
        }

        function formatiereSekunden(sek) {
            const h = Math.floor(sek / 3600);
            const m = Math.floor((sek % 3600) / 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        // ==========================================
        // GITHUB API ZUGRIFF
        // ==========================================
        async function ladeDatenVonGitHub() {
            document.getElementById("ui-username").innerText = `${GH_NAME} (${GH_PNR})`;
            if (!GH_TOKEN || GH_TOKEN.length < 10) {
                document.getElementById("ui-status").innerText = "Token fehlt!";
                return;
            }

            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${getMonatsDateiname()}`;
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
                });

                if (response.status === 404) {
                    lokalerInhalt = "Zeitstempel;Mitarbeiter;Status;AuftragsNr;Fahrtziel\n";
                    letzterSha = "";
                    aktualisiereUI();
                    return;
                }

                if (!response.ok) throw new Error("Fehler beim Laden");

                const data = await response.json();
                letzterSha = data.sha;
                lokalerInhalt = decodeURIComponent(escape(atob(data.content)));
                
                const now = new Date();
                document.getElementById("syncInfo").innerText = `Letzter Sync: ${now.toLocaleTimeString()}`;
                
                aktualisiereUI();
            } catch (err) {
                alert("Verbindungsfehler zu GitHub.");
                console.error(err);
            }
        }

        async function sichereDatenAufGitHub(neuerInhalt, commitMessage) {
            document.getElementById("ui-status").innerText = "Speichert...";
            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${getMonatsDateiname()}`;
            
            const b64Content = btoa(unescape(encodeURIComponent(neuerInhalt)));
            const bodyData = { message: commitMessage, content: b64Content };
            if (letzterSha) bodyData.sha = letzterSha;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) throw new Error("Speichern fehlgeschlagen");
                
                document.getElementById("repNummer").value = "";
                document.getElementById("fahrtZiel").value = "";
                ladeDatenVonGitHub();
            } catch (err) {
                alert("Fehler beim Speichern!");
                console.error(err);
            }
        }

        function buche(status) {
            const rep = document.getElementById("repNummer").value.trim();
            const ziel = document.getElementById("fahrtZiel").value.trim();
            
            const now = new Date();
            const timestamp = now.getFullYear() + "-" + 
                              String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                              String(now.getDate()).padStart(2, '0') + " " + 
                              String(now.getHours()).padStart(2, '0') + ":" + 
                              String(now.getMinutes()).padStart(2, '0') + ":" + 
                              String(now.getSeconds()).padStart(2, '0');

            const neueZeile = `${timestamp};${GH_NAME};${status};${rep};${ziel}\n`;
            if (lokalerInhalt === "") {
                lokalerInhalt = "Zeitstempel;Mitarbeiter;Status;AuftragsNr;Fahrtziel\n";
            }
            
            const neuerInhalt = lokalerInhalt + neueZeile;
            sichereDatenAufGitHub(neuerInhalt, `Web-Buchung: ${status}`);
        }

        // ==========================================
        // UI & DASHBOARD LOGIK
        // ==========================================
        function aktualisiereUI() {
            const zeilen = lokalerInhalt.split('\n').filter(z => z.length > 10 && !z.startsWith("Zeitstempel"));
            if (zeilen.length === 0) return;

            const now = new Date();
            const heuteTag = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');
            const wochentag = now.getDay(); 

            let arbeitSekundenHeute = 0;
            let pauseSekundenHeute = 0;
            let letzterStatusWechsel = 0;
            let letzterStatus = "";
            let ersterStartSek = -1;

            const htmlZeilen = [];

            // Alle Zeilen auswerten
            for (let i = 0; i < zeilen.length; i++) {
                const z = zeilen[i];
                const parts = z.split(';');
                if (parts.length < 3) continue;

                const stamp = parts[0];
                let statusRaw = parts[2].trim();
                let repNummer = (parts.length > 3) ? parts[3].trim() : "";
                
                // Normalisieren
                let istKommen = (statusRaw === "START" || statusRaw === "KOMMEN" || statusRaw === "ARBEIT_START");
                let istPause  = (statusRaw === "PAUSE");
                let istGehen  = (statusRaw === "ENDE" || statusRaw === "GEHEN" || statusRaw === "ARBEIT_ENDE");

                let anzeigeStatus = istKommen ? "KOMMEN" : (istPause ? "PAUSE" : "GEHEN");
                let badgeClass = istKommen ? "bg-kommen" : (istPause ? "bg-pause" : "bg-gehen");

                // Historie-Liste füllen (Rückwärts, max 10 Einträge)
                if (zeilen.length - i <= 10) {
                    const uhrzeit = stamp.substring(11, 19);
                    const datumKurz = stamp.substring(8, 10) + "." + stamp.substring(5, 7) + ".";
                    let metaHTML = `<span class="hist-meta">${datumKurz}</span>`;
                    if (repNummer) metaHTML += `<span class="hist-meta" style="color:var(--text-light)"> | ${repNummer}</span>`;

                    htmlZeilen.unshift(`
                        <div class="hist-item">
                            <div class="hist-info">
                                <span class="hist-time">${uhrzeit}</span>
                                ${metaHTML}
                            </div>
                            <span class="hist-badge ${badgeClass}">${anzeigeStatus}</span>
                        </div>
                    `);
                }

                // Zeiten für Heute berechnen
                if (stamp.startsWith(heuteTag)) {
                    const sec = getSekunden(stamp.substring(11, 19));
                    
                    if (ersterStartSek < 0 && istKommen) ersterStartSek = sec;

                    if (letzterStatus === "KOMMEN") {
                        arbeitSekundenHeute += (sec - letzterStatusWechsel);
                    } else if (letzterStatus === "PAUSE") {
                        pauseSekundenHeute += (sec - letzterStatusWechsel);
                    }

                    letzterStatus = istKommen ? "KOMMEN" : (istPause ? "PAUSE" : "GEHEN");
                    letzterStatusWechsel = sec;
                }
            }

            document.getElementById("historieContainer").innerHTML = htmlZeilen.join('');

            // Status Badge Aktualisieren
            const statusEl = document.getElementById("ui-status");
            statusEl.className = "status-badge";
            if (letzterStatus === "KOMMEN") {
                statusEl.classList.add("status-kommen");
                statusEl.innerText = "Eingestempelt";
            } else if (letzterStatus === "PAUSE") {
                statusEl.classList.add("status-pause");
                statusEl.innerText = "In Pause";
            } else if (letzterStatus === "GEHEN") {
                statusEl.classList.add("status-gehen");
                statusEl.innerText = "Feierabend";
            } else {
                statusEl.innerText = "Abgemeldet";
            }

            // Live-Zeiten dazurechnen (wie am Terminal)
            const jetzSek = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            if (letzterStatus === "KOMMEN") {
                arbeitSekundenHeute += (jetzSek - letzterStatusWechsel);
            } else if (letzterStatus === "PAUSE") {
                pauseSekundenHeute += (jetzSek - letzterStatusWechsel);
            }

            document.getElementById("ui-arbeitszeit").innerText = formatiereSekunden(arbeitSekundenHeute) + " Std.";
            document.getElementById("ui-pausenzeit").innerText = formatiereSekunden(pauseSekundenHeute) + " Std.";

            // Überstunden berechnen
            let tagesSoll = 30600; // 8.5h
            if (wochentag === 5) tagesSoll = 18000; // 5.0h Fr
            if (wochentag === 0 || wochentag === 6) tagesSoll = 0; // WE

            let heuteUeberSek = 0;
            if (arbeitSekundenHeute > tagesSoll) {
                heuteUeberSek = arbeitSekundenHeute - tagesSoll;
            }

            const aktuellesKonto = UEBERSTUNDEN_START + (heuteUeberSek / 3600.0);
            
            const uKachel = document.getElementById("ui-ueberstunden");
            uKachel.innerText = (aktuellesKonto > 0 ? "+" : "") + aktuellesKonto.toFixed(2) + " Std.";
            
            if (aktuellesKonto < 0) {
                uKachel.classList.add("minus");
            } else {
                uKachel.classList.remove("minus");
            }
        }

        // Start
        ladeDatenVonGitHub();
        // Live-Tick jede Sekunde
        setInterval(aktualisiereUI, 1000);
    </script>
</body>
</html>
